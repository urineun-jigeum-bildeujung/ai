name: 버그 신고
description: 재현 가능한 오류를 기록합니다.
title: "[Bug] "
labels:
  - "type:bug"
body:
  - type: dropdown
    id: area
    attributes:
      label: 담당 영역
      description: 문제가 발생한 영역을 선택해주세요. Issue 생성 후 해당 area Label도 지정해주세요.
      options:
        - "area:repurchase"
        - "area:recommendation"
        - "area:nutrition"
        - "area:platform"
    validations:
      required: true

  - type: textarea
    id: summary
    attributes:
      label: 문제 설명
      description: 어떤 문제가 발생했는지 간단히 작성해주세요.
      placeholder: 오류가 발생한 기능과 상황을 작성해주세요.
    validations:
      required: true

  - type: textarea
    id: steps
    attributes:
      label: 재현 방법
      description: 다른 팀원이 같은 문제를 재현할 수 있도록 순서대로 작성해주세요.
      value: |
        1.
        2.
        3.
    validations:
      required: true

  - type: textarea
    id: expected
    attributes:
      label: 기대 결과
      description: 정상적으로 동작한다면 어떤 결과가 나와야 하는지 작성해주세요.
    validations:
      required: true

  - type: textarea
    id: actual
    attributes:
      label: 실제 결과
      description: 실제로 발생한 결과를 작성해주세요.
    validations:
      required: true

  - type: textarea
    id: evidence
    attributes:
      label: 로그 및 참고 자료
      description: 오류 로그, API 응답, 스크린샷 등이 있다면 첨부해주세요.
    validations:
      required: false

  - type: input
    id: environment
    attributes:
      label: 실행 환경
      description: 필요한 경우 Python 버전, OS, 브랜치 또는 모델 버전을 작성해주세요.
      placeholder: 예) Python 3.11 / macOS / develop
    validations:
      required: false
