name: Repurchase CI

on:
  pull_request:
    branches:
      - develop
      - main
    paths:
      - "repurchase/**"
      - ".github/workflows/repurchase-ci.yml"
  push:
    branches:
      - develop
      - main
    paths:
      - "repurchase/**"
      - ".github/workflows/repurchase-ci.yml"
  workflow_dispatch:

# 저장소 코드를 읽는 데 필요한 최소 권한만 부여합니다.
permissions:
  contents: read

# 같은 브랜치에 새 변경이 들어오면 이전 실행을 취소해 실행 시간을 절약합니다.
concurrency:
  group: repurchase-ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  repurchase-quality:
    name: repurchase-quality
    runs-on: ubuntu-latest
    timeout-minutes: 15

    defaults:
      run:
        working-directory: repurchase/data_analysis

    steps:
      - name: 저장소 코드 가져오기
        # actions/checkout v7.0.1을 정확한 커밋으로 고정합니다.
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1

      - name: Python 3.11 설정 및 pip 캐시 복원
        # actions/setup-python v7.0.0을 정확한 커밋으로 고정합니다.
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: "3.11.15"
          cache: pip
          cache-dependency-path: |
            repurchase/data_analysis/requirements.txt
            repurchase/data_analysis/requirements-dev.txt

      - name: 개발·테스트 의존성 설치
        run: python -m pip install -r requirements-dev.txt

      - name: Ruff 정적 검사
        run: python -m ruff check .

      - name: Ruff 포맷 검사
        run: python -m ruff format --check .

      - name: 전체 테스트 실행
        run: python -m pytest
