name: Repurchase CI

on:
  pull_request:
    branches:
      - develop
      - main
  push:
    branches:
      - develop
      - main
  workflow_dispatch:

# 저장소 코드를 읽는 데 필요한 최소 권한만 부여합니다.
permissions:
  contents: read

# 같은 브랜치에 새 변경이 들어오면 이전 실행을 취소해 실행 시간을 절약합니다.
concurrency:
  group: repurchase-ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  repurchase-quality:
    name: repurchase-quality
    runs-on: ubuntu-latest
    timeout-minutes: 15

    defaults:
      run:
        working-directory: repurchase/data_analysis

    steps:
      - name: 저장소 코드 가져오기
        # actions/checkout v7.0.1을 정확한 커밋으로 고정합니다.
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          # PR과 push의 기준 커밋을 모두 비교할 수 있도록 전체 이력을 가져옵니다.
          fetch-depth: 0

      - name: 재구매 관련 변경 여부 확인
        id: changes
        working-directory: .
        shell: bash
        env:
          EVENT_NAME: ${{ github.event_name }}
          PR_BASE_SHA: ${{ github.event.pull_request.base.sha }}
          PR_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          PUSH_BASE_SHA: ${{ github.event.before }}
          CURRENT_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail

          if [[ "${EVENT_NAME}" == "workflow_dispatch" ]]; then
            should_run="true"
            reason="수동 실행은 전체 재구매 검증을 수행합니다."
          elif [[ "${EVENT_NAME}" == "pull_request" ]]; then
            base_sha="${PR_BASE_SHA}"
            head_sha="${PR_HEAD_SHA}"
          else
            base_sha="${PUSH_BASE_SHA}"
            head_sha="${CURRENT_SHA}"
          fi

          if [[ -z "${should_run:-}" ]]; then
            if [[ -z "${base_sha}" || "${base_sha}" =~ ^0+$ ]]; then
              should_run="true"
              reason="비교 기준 커밋이 없어 안전하게 전체 검증을 수행합니다."
            elif ! git cat-file -e "${base_sha}^{commit}" 2>/dev/null; then
              should_run="true"
              reason="비교 기준 커밋을 찾을 수 없어 안전하게 전체 검증을 수행합니다."
            elif git diff --quiet "${base_sha}" "${head_sha}" -- \
              repurchase/ \
              .github/workflows/repurchase-ci.yml; then
              should_run="false"
              reason="재구매 파트와 재구매 CI 파일의 변경이 없습니다."
            else
              should_run="true"
              reason="재구매 파트 또는 재구매 CI 파일이 변경되었습니다."
            fi
          fi

          if [[ "${should_run}" != "true" ]]; then
            container_changed="false"
          elif [[ "${EVENT_NAME}" == "workflow_dispatch" ]]; then
            container_changed="true"
          elif [[ -z "${base_sha:-}" || "${base_sha}" =~ ^0+$ ]]; then
            container_changed="true"
          elif ! git cat-file -e "${base_sha}^{commit}" 2>/dev/null; then
            container_changed="true"
          elif git diff --quiet "${base_sha}" "${head_sha}" -- \
            repurchase/data_analysis/Dockerfile \
            repurchase/data_analysis/.dockerignore \
            repurchase/data_analysis/requirements-runtime.txt \
            repurchase/data_analysis/scripts/run_repurchase_batch.py; then
            container_changed="false"
          else
            container_changed="true"
          fi

          echo "run=${should_run}" >> "${GITHUB_OUTPUT}"
          echo "container_changed=${container_changed}" >> "${GITHUB_OUTPUT}"
          echo "${reason}"

      - name: Python 3.11 설정 및 pip 캐시 복원
        if: steps.changes.outputs.run == 'true'
        # actions/setup-python v7.0.0을 정확한 커밋으로 고정합니다.
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: "3.11.15"
          cache: pip
          cache-dependency-path: |
            repurchase/data_analysis/requirements-runtime.txt
            repurchase/data_analysis/requirements.txt
            repurchase/data_analysis/requirements-dev.txt

      - name: 개발·테스트 의존성 설치
        if: steps.changes.outputs.run == 'true'
        run: python -m pip install -r requirements-dev.txt

      - name: Ruff 정적 검사
        if: steps.changes.outputs.run == 'true'
        run: python -m ruff check .

      - name: Ruff 포맷 검사
        if: steps.changes.outputs.run == 'true'
        run: python -m ruff format --check .

      - name: 전체 테스트 실행
        id: tests
        if: steps.changes.outputs.run == 'true'
        # 저장소 밖 임시 경로에 결과를 생성하며 표준 출력 로그는 XML에 첨부하지 않습니다.
        run: >-
          python -m pytest
          --junitxml="${RUNNER_TEMP}/repurchase-test-results/junit.xml"
          -o junit_logging=no

      - name: 재구매 배치 Docker 이미지 빌드
        if: steps.changes.outputs.container_changed == 'true'
        working-directory: .
        run: >-
          docker build
          --tag "gollajugaenyang-repurchase-batch:${GITHUB_SHA}"
          repurchase/data_analysis

      - name: 재구매 배치 컨테이너 계약 smoke test
        if: steps.changes.outputs.container_changed == 'true'
        working-directory: .
        run: >-
          docker run --rm
          --volume "${GITHUB_WORKSPACE}/repurchase/data_analysis/tests/fixtures/cloud_contract:/input:ro"
          "gollajugaenyang-repurchase-batch:${GITHUB_SHA}"
          contract-check
          --source-contract /input/source_orders.json
          --publication-contract /input/prediction_publications.json

      - name: 테스트 결과 파일 보관
        # 테스트 실패 후에도 업로드하되, 미실행·취소된 실행은 제외합니다.
        if: ${{ !cancelled() && (steps.tests.outcome == 'success' || steps.tests.outcome == 'failure') }}
        # actions/upload-artifact v7.0.1을 정확한 커밋으로 고정합니다.
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: repurchase-tests-${{ github.run_id }}-${{ github.run_attempt }}
          # 원본 데이터·모델·전체 로그 대신 테스트 결과 파일 하나만 업로드합니다.
          path: ${{ runner.temp }}/repurchase-test-results/junit.xml
          retention-days: 14
          if-no-files-found: error

      - name: 비관련 변경 검사 생략
        if: steps.changes.outputs.run != 'true'
        working-directory: .
        run: echo "재구매 관련 변경이 없어 Python 설치와 품질 검사를 생략합니다."
