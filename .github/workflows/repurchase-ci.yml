name: Repurchase CI

on:
  pull_request:
    branches:
      - develop
      - main
  push:
    branches:
      - develop
      - main
  workflow_dispatch:

# 저장소 코드를 읽는 데 필요한 최소 권한만 부여합니다.
permissions:
  contents: read

# 같은 브랜치에 새 변경이 들어오면 이전 실행을 취소해 실행 시간을 절약합니다.
concurrency:
  group: repurchase-ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  repurchase-quality:
    name: repurchase-quality
    runs-on: ubuntu-latest
    timeout-minutes: 15

    defaults:
      run:
        working-directory: repurchase/data_analysis

    steps:
      - name: 저장소 코드 가져오기
        # actions/checkout v7.0.1을 정확한 커밋으로 고정합니다.
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          # PR과 push의 기준 커밋을 모두 비교할 수 있도록 전체 이력을 가져옵니다.
          fetch-depth: 0

      - name: 재구매 관련 변경 여부 확인
        id: changes
        working-directory: .
        shell: bash
        env:
          EVENT_NAME: ${{ github.event_name }}
          PR_BASE_SHA: ${{ github.event.pull_request.base.sha }}
          PR_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          PUSH_BASE_SHA: ${{ github.event.before }}
          CURRENT_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail

          if [[ "${EVENT_NAME}" == "workflow_dispatch" ]]; then
            should_run="true"
            reason="수동 실행은 전체 재구매 검증을 수행합니다."
          elif [[ "${EVENT_NAME}" == "pull_request" ]]; then
            base_sha="${PR_BASE_SHA}"
            head_sha="${PR_HEAD_SHA}"
          else
            base_sha="${PUSH_BASE_SHA}"
            head_sha="${CURRENT_SHA}"
          fi

          if [[ -z "${should_run:-}" ]]; then
            if [[ -z "${base_sha}" || "${base_sha}" =~ ^0+$ ]]; then
              should_run="true"
              reason="비교 기준 커밋이 없어 안전하게 전체 검증을 수행합니다."
            elif ! git cat-file -e "${base_sha}^{commit}" 2>/dev/null; then
              should_run="true"
              reason="비교 기준 커밋을 찾을 수 없어 안전하게 전체 검증을 수행합니다."
            elif git diff --quiet "${base_sha}" "${head_sha}" -- \
              repurchase/ \
              .github/workflows/repurchase-ci.yml; then
              should_run="false"
              reason="재구매 파트와 재구매 CI 파일의 변경이 없습니다."
            else
              should_run="true"
              reason="재구매 파트 또는 재구매 CI 파일이 변경되었습니다."
            fi
          fi

          echo "run=${should_run}" >> "${GITHUB_OUTPUT}"
          echo "${reason}"

      - name: Python 3.11 설정 및 pip 캐시 복원
        if: steps.changes.outputs.run == 'true'
        # actions/setup-python v7.0.0을 정확한 커밋으로 고정합니다.
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: "3.11.15"
          cache: pip
          cache-dependency-path: |
            repurchase/data_analysis/requirements.txt
            repurchase/data_analysis/requirements-dev.txt

      - name: 개발·테스트 의존성 설치
        if: steps.changes.outputs.run == 'true'
        run: python -m pip install -r requirements-dev.txt

      - name: Ruff 정적 검사
        if: steps.changes.outputs.run == 'true'
        run: python -m ruff check .

      - name: Ruff 포맷 검사
        if: steps.changes.outputs.run == 'true'
        run: python -m ruff format --check .

      - name: 전체 테스트 실행
        if: steps.changes.outputs.run == 'true'
        run: python -m pytest

      - name: 비관련 변경 검사 생략
        if: steps.changes.outputs.run != 'true'
        working-directory: .
        run: echo "재구매 관련 변경이 없어 Python 설치와 품질 검사를 생략합니다."
