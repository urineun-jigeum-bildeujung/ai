name: Repurchase CI

on:
  pull_request:
    branches:
      - develop
      - main
  push:
    branches:
      - develop
      - main
  workflow_dispatch:

# 저장소 코드를 읽는 데 필요한 최소 권한만 부여합니다.
permissions:
  contents: read

# PR은 같은 번호의 이전 검사를 취소하고, push는 커밋별로 독립 실행합니다.
# 중간 push가 대기열에서 교체되지 않게 하며 stable의 최신성은 revision 선후 관계로 보장합니다.
concurrency:
  group: repurchase-ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  repurchase-quality:
    name: repurchase-quality
    runs-on: ubuntu-latest
    timeout-minutes: 15
    outputs:
      container_changed: ${{ steps.changes.outputs.container_changed }}

    defaults:
      run:
        working-directory: repurchase/data_analysis

    steps:
      - name: 저장소 코드 가져오기
        # actions/checkout v7.0.1을 정확한 커밋으로 고정합니다.
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          # PR과 push의 기준 커밋을 모두 비교할 수 있도록 전체 이력을 가져옵니다.
          fetch-depth: 0

      - name: 재구매 관련 변경 여부 확인
        id: changes
        working-directory: .
        shell: bash
        env:
          EVENT_NAME: ${{ github.event_name }}
          PR_BASE_SHA: ${{ github.event.pull_request.base.sha }}
          PR_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          PUSH_BASE_SHA: ${{ github.event.before }}
          CURRENT_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail

          if [[ "${EVENT_NAME}" == "workflow_dispatch" ]]; then
            should_run="true"
            reason="수동 실행은 전체 재구매 검증을 수행합니다."
          elif [[ "${EVENT_NAME}" == "pull_request" ]]; then
            base_sha="${PR_BASE_SHA}"
            head_sha="${PR_HEAD_SHA}"
          else
            base_sha="${PUSH_BASE_SHA}"
            head_sha="${CURRENT_SHA}"
          fi

          if [[ -z "${should_run:-}" ]]; then
            if [[ -z "${base_sha}" || "${base_sha}" =~ ^0+$ ]]; then
              should_run="true"
              reason="비교 기준 커밋이 없어 안전하게 전체 검증을 수행합니다."
            elif ! git cat-file -e "${base_sha}^{commit}" 2>/dev/null; then
              should_run="true"
              reason="비교 기준 커밋을 찾을 수 없어 안전하게 전체 검증을 수행합니다."
            elif git diff --quiet "${base_sha}" "${head_sha}" -- \
              repurchase/ \
              .github/workflows/repurchase-ci.yml; then
              should_run="false"
              reason="재구매 파트와 재구매 CI 파일의 변경이 없습니다."
            else
              should_run="true"
              reason="재구매 파트 또는 재구매 CI 파일이 변경되었습니다."
            fi
          fi

          if [[ "${should_run}" != "true" ]]; then
            container_changed="false"
          elif [[ "${EVENT_NAME}" == "workflow_dispatch" ]]; then
            container_changed="true"
          elif [[ -z "${base_sha:-}" || "${base_sha}" =~ ^0+$ ]]; then
            container_changed="true"
          elif ! git cat-file -e "${base_sha}^{commit}" 2>/dev/null; then
            container_changed="true"
          elif git diff --quiet "${base_sha}" "${head_sha}" -- \
            repurchase/data_analysis/Dockerfile \
            repurchase/data_analysis/.dockerignore \
            repurchase/data_analysis/requirements-runtime.txt \
            repurchase/data_analysis/image-release.txt \
            repurchase/data_analysis/scripts/; then
            container_changed="false"
          else
            container_changed="true"
          fi

          echo "run=${should_run}" >> "${GITHUB_OUTPUT}"
          echo "container_changed=${container_changed}" >> "${GITHUB_OUTPUT}"
          echo "${reason}"

      - name: Python 3.11 설정 및 pip 캐시 복원
        if: steps.changes.outputs.run == 'true'
        # actions/setup-python v7.0.0을 정확한 커밋으로 고정합니다.
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: "3.11.15"
          cache: pip
          cache-dependency-path: |
            repurchase/data_analysis/requirements-runtime.txt
            repurchase/data_analysis/requirements.txt
            repurchase/data_analysis/requirements-dev.txt

      - name: 개발·테스트 의존성 설치
        if: steps.changes.outputs.run == 'true'
        run: python -m pip install -r requirements-dev.txt

      - name: Ruff 정적 검사
        if: steps.changes.outputs.run == 'true'
        run: python -m ruff check .

      - name: Ruff 포맷 검사
        if: steps.changes.outputs.run == 'true'
        run: python -m ruff format --check .

      - name: 전체 테스트 실행
        id: tests
        if: steps.changes.outputs.run == 'true'
        # 저장소 밖 임시 경로에 결과를 생성하며 표준 출력 로그는 XML에 첨부하지 않습니다.
        run: >-
          python -m pytest
          --junitxml="${RUNNER_TEMP}/repurchase-test-results/junit.xml"
          -o junit_logging=no

      - name: 재구매 배치 Docker 이미지 빌드
        if: steps.changes.outputs.container_changed == 'true'
        working-directory: .
        run: >-
          docker build
          --platform linux/amd64
          --tag "gollajugaenyang-repurchase-batch:${GITHUB_SHA}"
          repurchase/data_analysis

      - name: 재구매 배치 컨테이너 계약 smoke test
        if: steps.changes.outputs.container_changed == 'true'
        working-directory: .
        run: >-
          docker run --rm
          --volume "${GITHUB_WORKSPACE}/repurchase/data_analysis/tests/fixtures/cloud_contract:/input:ro"
          "gollajugaenyang-repurchase-batch:${GITHUB_SHA}"
          contract-check
          --source-contract /input/source_orders.json
          --publication-contract /input/prediction_publications.json

      - name: 테스트 결과 파일 보관
        # 테스트 실패 후에도 업로드하되, 미실행·취소된 실행은 제외합니다.
        if: ${{ !cancelled() && (steps.tests.outcome == 'success' || steps.tests.outcome == 'failure') }}
        # actions/upload-artifact v7.0.1을 정확한 커밋으로 고정합니다.
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: repurchase-tests-${{ github.run_id }}-${{ github.run_attempt }}
          # 원본 데이터·모델·전체 로그 대신 테스트 결과 파일 하나만 업로드합니다.
          path: ${{ runner.temp }}/repurchase-test-results/junit.xml
          retention-days: 14
          if-no-files-found: error

      - name: 비관련 변경 검사 생략
        if: steps.changes.outputs.run != 'true'
        working-directory: .
        run: echo "재구매 관련 변경이 없어 Python 설치와 품질 검사를 생략합니다."

  publish-repurchase-image:
    name: publish-repurchase-image
    needs: repurchase-quality
    if: >-
      github.event_name == 'push' &&
      github.ref == 'refs/heads/main' &&
      needs.repurchase-quality.outputs.container_changed == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15

    # Registry 쓰기 권한은 main 이미지 등록 Job에만 부여합니다.
    permissions:
      contents: read
      packages: write

    steps:
      - name: 저장소 코드 가져오기
        # actions/checkout v7.0.1을 정확한 커밋으로 고정합니다.
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          # 현재 stable 이미지의 커밋과 후보 커밋의 선후 관계를 검사합니다.
          fetch-depth: 0

      - name: 이미지 이름과 불변 태그 생성
        id: image
        shell: bash
        run: |
          set -euo pipefail

          image_name="ghcr.io/${GITHUB_REPOSITORY_OWNER,,}/ai-repurchase-batch"
          sha_tag="sha-${GITHUB_SHA}"

          echo "name=${image_name}" >> "${GITHUB_OUTPUT}"
          echo "sha_tag=${sha_tag}" >> "${GITHUB_OUTPUT}"
          echo "sha_ref=${image_name}:${sha_tag}" >> "${GITHUB_OUTPUT}"
          echo "stable_ref=${image_name}:stable" >> "${GITHUB_OUTPUT}"

      - name: 배포 후보 이미지 빌드
        working-directory: .
        env:
          SHA_IMAGE_REF: ${{ steps.image.outputs.sha_ref }}
        run: >-
          docker build
          --platform linux/amd64
          --label "org.opencontainers.image.source=${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}"
          --label "org.opencontainers.image.revision=${GITHUB_SHA}"
          --tag "${SHA_IMAGE_REF}"
          repurchase/data_analysis

      - name: 배포 후보 계약 smoke test
        working-directory: .
        env:
          SHA_IMAGE_REF: ${{ steps.image.outputs.sha_ref }}
        run: >-
          docker run --rm
          --volume "${GITHUB_WORKSPACE}/repurchase/data_analysis/tests/fixtures/cloud_contract:/input:ro"
          "${SHA_IMAGE_REF}"
          contract-check
          --source-contract /input/source_orders.json
          --publication-contract /input/prediction_publications.json

      - name: GHCR 로그인
        # docker/login-action v3.6.0을 정확한 커밋으로 고정합니다.
        uses: docker/login-action@65b78e6e13532edd9afa3aa52ac7964289d1a9c1
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}

      - name: 불변 이미지와 stable 태그 등록
        id: publish
        shell: bash
        env:
          SHA_IMAGE_REF: ${{ steps.image.outputs.sha_ref }}
          STABLE_IMAGE_REF: ${{ steps.image.outputs.stable_ref }}
        run: |
          set -euo pipefail

          digest_pattern='^sha256:[0-9a-f]{64}$'

          # Registry가 푸시 직후 manifest를 늦게 노출할 수 있어 읽기 조회만 재시도합니다.
          inspect_digest() {
            local image_ref="$1"
            local digest=""

            for attempt in 1 2 3 4 5; do
              if digest="$(
                docker buildx imagetools inspect "${image_ref}" \
                  --format '{{.Manifest.Digest}}' 2>/dev/null
              )" && [[ "${digest}" =~ ${digest_pattern} ]]; then
                printf '%s\n' "${digest}"
                return 0
              fi

              if [[ "${attempt}" -lt 5 ]]; then
                sleep 2
              fi
            done

            echo "Registry digest를 올바른 형식으로 확인하지 못했습니다: ${image_ref}" >&2
            return 1
          }

          # 기존 태그가 없을 때 오류를 출력하지 않고 한 번만 조회합니다.
          try_inspect_digest() {
            local image_ref="$1"
            local digest=""

            if digest="$(
              docker buildx imagetools inspect "${image_ref}" \
                --format '{{.Manifest.Digest}}' 2>/dev/null
            )" && [[ "${digest}" =~ ${digest_pattern} ]]; then
              printf '%s\n' "${digest}"
              return 0
            fi

            return 1
          }

          # 원격 이미지가 어떤 Git 커밋에서 생성됐는지 OCI 라벨로 확인합니다.
          read_revision_label() {
            local image_ref="$1"

            docker pull --platform linux/amd64 "${image_ref}" >/dev/null
            docker image inspect \
              --format '{{ index .Config.Labels "org.opencontainers.image.revision" }}' \
              "${image_ref}"
          }

          # 로컬 이미지 재직렬화 없이 Registry의 검증된 manifest를 stable로 복사합니다.
          publish_stable_manifest() {
            docker buildx imagetools create \
              --prefer-index=false \
              --tag "${STABLE_IMAGE_REF}" \
              "${SHA_IMAGE_REF%:*}@${sha_digest}"
          }

          sha_action="published"
          if sha_digest="$(try_inspect_digest "${SHA_IMAGE_REF}")"; then
            sha_revision="$(read_revision_label "${SHA_IMAGE_REF}")"
            if [[ "${sha_revision}" != "${GITHUB_SHA}" ]]; then
              echo "기존 불변 태그의 revision 라벨이 현재 커밋과 다릅니다." >&2
              exit 1
            fi
            sha_action="reused"
          else
            docker push "${SHA_IMAGE_REF}"
            sha_digest="$(inspect_digest "${SHA_IMAGE_REF}")"
          fi

          stable_action="published"
          if stable_digest="$(try_inspect_digest "${STABLE_IMAGE_REF}")"; then
            stable_revision="$(read_revision_label "${STABLE_IMAGE_REF}")"
            if [[ ! "${stable_revision}" =~ ^[0-9a-f]{40}$ ]]; then
              echo "현재 stable 이미지의 revision 라벨이 올바르지 않습니다." >&2
              exit 1
            fi
            if ! git cat-file -e "${stable_revision}^{commit}" 2>/dev/null; then
              echo "현재 stable 이미지의 커밋을 저장소 이력에서 찾을 수 없습니다." >&2
              exit 1
            fi

            if [[ "${stable_revision}" == "${GITHUB_SHA}" ]]; then
              if [[ "${stable_digest}" != "${sha_digest}" ]]; then
                echo "같은 커밋의 불변 태그와 stable 태그 digest가 다릅니다." >&2
                exit 1
              fi
              stable_action="reused"
            elif git merge-base --is-ancestor "${stable_revision}" "${GITHUB_SHA}"; then
              publish_stable_manifest
              stable_digest="$(inspect_digest "${STABLE_IMAGE_REF}")"
              stable_action="updated"
            elif git merge-base --is-ancestor "${GITHUB_SHA}" "${stable_revision}"; then
              stable_action="skipped_older_candidate"
            else
              echo "후보 커밋과 현재 stable 커밋의 선후 관계를 결정할 수 없습니다." >&2
              exit 1
            fi
          else
            publish_stable_manifest
            stable_digest="$(inspect_digest "${STABLE_IMAGE_REF}")"
          fi

          if [[ "${stable_action}" != "skipped_older_candidate" ]] && \
            [[ "${sha_digest}" != "${stable_digest}" ]]; then
            echo "불변 태그와 stable 태그의 digest가 다릅니다." >&2
            exit 1
          fi

          echo "digest=${sha_digest}" >> "${GITHUB_OUTPUT}"
          echo "sha_action=${sha_action}" >> "${GITHUB_OUTPUT}"
          echo "stable_digest=${stable_digest}" >> "${GITHUB_OUTPUT}"
          echo "stable_action=${stable_action}" >> "${GITHUB_OUTPUT}"

      - name: 등록 결과 요약
        env:
          SHA_IMAGE_REF: ${{ steps.image.outputs.sha_ref }}
          STABLE_IMAGE_REF: ${{ steps.image.outputs.stable_ref }}
          IMAGE_DIGEST: ${{ steps.publish.outputs.digest }}
          SHA_ACTION: ${{ steps.publish.outputs.sha_action }}
          STABLE_DIGEST: ${{ steps.publish.outputs.stable_digest }}
          STABLE_ACTION: ${{ steps.publish.outputs.stable_action }}
        run: |
          {
            echo "### 재구매 배치 이미지 등록"
            echo ""
            echo "- 불변 태그: \`${SHA_IMAGE_REF}\` (\`${SHA_ACTION}\`)"
            echo "- 불변 태그 digest: \`${IMAGE_DIGEST}\`"
            echo "- 이동 태그: \`${STABLE_IMAGE_REF}\` (\`${STABLE_ACTION}\`)"
            echo "- 이동 태그 digest: \`${STABLE_DIGEST}\`"
            echo "- 운영 배포는 태그보다 stable이 가리키는 digest 참조를 권장합니다."
          } >> "${GITHUB_STEP_SUMMARY}"
